{{- /* Each secret is the value given, else the one this release already holds,
       else generated: an install needs nothing typed in, and an upgrade keeps
       what the database and the stored endpoint keys were made with. `helm
       template` sees no live Secret and renders fresh ones it never applies. */ -}}
{{- $live := (lookup "v1" "Secret" .Release.Namespace (include "llm-bench.fullname" .)).data | default dict -}}
{{- $kept := dict -}}
{{- range $k := list "SECRET_KEY" "PLATFORM_SECRET_KEY" "ADMIN_PASSWORD" "POSTGRES_PASSWORD" "SERVICE_API_KEY" -}}
{{- $_ := set $kept $k (index $live $k | default "" | b64dec) -}}
{{- end -}}
{{- $s := .Values.secrets -}}
{{- $pgPass := .Values.postgres.password | default $kept.POSTGRES_PASSWORD | default (randAlphaNum 32) -}}
{{- $serviceKey := $s.serviceApiKey -}}
{{- if and (not $serviceKey) $s.serviceAccount -}}
{{- $serviceKey = $kept.SERVICE_API_KEY | default (printf "llmb_%s" (randAlphaNum 43)) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-bench.fullname" . }}
  labels:
    {{- include "llm-bench.labels" . | nindent 4 }}
  # Keep across helm uninstall — paired with the postgres PVC, which is also
  # `keep`. If the PVC is preserved but the Secret is recreated with a fresh
  # POSTGRES_PASSWORD, the postgres data dir's cached role password no longer
  # matches the env var and the backend hits InvalidPasswordError (see
  # docs/deploying.md). PLATFORM_SECRET_KEY is also in here: rotating it
  # invalidates every stored endpoint API key, so an accidental rotation on
  # uninstall+reinstall would silently break every saved credential. To force a
  # rotation, `kubectl delete secret <name>` first.
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SECRET_KEY: {{ $s.secretKey | default $kept.SECRET_KEY | default (randAlphaNum 48) | quote }}
  PLATFORM_SECRET_KEY: {{ $s.platformSecretKey | default $kept.PLATFORM_SECRET_KEY | default (randAlphaNum 48) | quote }}
  ADMIN_EMAIL: {{ $s.adminEmail | default "admin@example.com" | quote }}
  ADMIN_USERNAME: {{ $s.adminUsername | default "admin" | quote }}
  ADMIN_PASSWORD: {{ $s.adminPassword | default $kept.ADMIN_PASSWORD | default (randAlphaNum 20) | quote }}
  {{- if $serviceKey }}
  # A `service` account for another platform (LLM AutoTune) and the exact key it
  # is configured with. seed.py stores only the key's hash. AutoTune installed
  # in this namespace can read it from here (its llmbench.apiKeySecret).
  SERVICE_USERNAME: {{ $s.serviceUsername | default "autotune" | quote }}
  SERVICE_API_KEY: {{ $serviceKey | quote }}
  {{- end }}
  {{- if .Values.datasetBuilder.enabled }}
  # Log-store credentials for the rolling dataset collector, and the shared
  # token the backend presents when it asks for a build. Kept out of the
  # profile rows on purpose: the database holds collection policy, the pod
  # holds the secret.
  REPLAY_FEED_VL_USERNAME: {{ .Values.datasetBuilder.auth.username | quote }}
  REPLAY_FEED_VL_PASSWORD: {{ .Values.datasetBuilder.auth.password | quote }}
  REPLAY_FEED_VL_TOKEN: {{ .Values.datasetBuilder.auth.token | quote }}
  DATASET_BUILDER_TOKEN: {{ .Values.datasetBuilder.builderToken | quote }}
  {{- end }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  # Here and not in the ConfigMap: they carry the password.
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgres.username }}:{{ $pgPass }}@{{ include "llm-bench.postgresql.fullname" . }}:5432/{{ .Values.postgres.database }}"
  DATABASE_URL_SYNC: "postgresql://{{ .Values.postgres.username }}:{{ $pgPass }}@{{ include "llm-bench.postgresql.fullname" . }}:5432/{{ .Values.postgres.database }}"
  REDIS_URL: "redis://{{ include "llm-bench.redis.fullname" . }}:6379/0"
