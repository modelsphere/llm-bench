apiVersion: v2
name: llm-bench
description: LLM Benchmark Platform - FastAPI backend, Vue frontend, Dramatiq workers

type: application

version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: postgresql
    version: 16.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 20.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
