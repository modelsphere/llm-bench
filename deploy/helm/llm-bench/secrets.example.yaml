# ---------------------------------------------------------------------------
# secrets.yaml — override file for sensitive values.
#
# DO NOT commit this file to git.  Copy it to secrets.yaml, fill in real
# values, and pass it to helm install:
#
#   helm install llm-bench ./helm-chart/llm-bench-platform -f secrets.yaml
#
# Generate strong random strings with:
#   openssl rand -base64 32
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
# ---------------------------------------------------------------------------

# JWT signing key and Fernet encryption key (must be 32-byte base64)
secrets:
  secretKey: "CHANGE-ME-use-openssl-rand-base64-32"
  platformSecretKey: "CHANGE-ME-use-openssl-rand-base64-32"

  # First admin account created by seed job
  adminEmail: "admin@example.com"
  adminUsername: "admin"
  adminPassword: "CHANGE-ME-strong-password"

# PostgreSQL credentials (used by custom postgres Deployment)
postgres:
  password: "CHANGE-ME-postgres-password"

# ---------------------------------------------------------------------------
# Optional overrides (uncomment if needed)
# ---------------------------------------------------------------------------

# If your registry needs authentication:
# imagePullSecrets:
#   - name: registry-pull-secret

# If your storage class supports ReadWriteMany / ReadOnlyMany:
# datasets:
#   enabled: true
#   storageClass: "nfs-client"
#   size: 50Gi

# Expose the frontend on a NodePort (alternative to Ingress / port-forward).
# Port must be inside the kube-apiserver's --service-node-port-range
# (default 30000-32767). Reachable at http://<any-node-ip>:<nodePort>.
# service:
#   frontend:
#     type: NodePort
#     nodePort: 31808
