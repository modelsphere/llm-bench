# Local development: Postgres and Redis only. The API, worker and frontend run
# natively with hot reload — see platform/README.md. For the whole platform in
# containers, use docker-compose.yml at the repository root.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llmbench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
