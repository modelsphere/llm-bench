server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Hashed build assets: immutable bytes per URL, so cache hard. `=404`
    # rather than SPA-fallback so a stale client asking for a rotated chunk
    # gets a real 404 (which vite:preloadError can recover from) instead of
    # index.html served as text/html (which the module loader cannot).
    # Kept in sync with the k8s ConfigMap in
    # helm-chart/llm-bench/templates/frontend-configmap.yaml, which
    # shadows this file on the cluster.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never serve these stale — heuristic caching would otherwise boot the old
    # bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /build-info.json {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
