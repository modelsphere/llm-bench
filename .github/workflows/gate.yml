name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: LICENSE is the Apache-2.0 text, unmodified
        run: |
          if ! grep -q "Apache License" LICENSE || ! grep -q "Version 2.0, January 2004" LICENSE; then
            echo "::error file=LICENSE::LICENSE is not the Apache-2.0 text."
            exit 1
          fi

  no-internal-references:
    # This repository was extracted from an internal one. Internal host,
    # registry and customer names are not secrets, but they are noise to every
    # reader and a slow leak of someone else's network. Catch them here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No internal hosts, registries or identifiers
        run: |
          pattern='4pd\.io|4paradigm|hardcore-tech|harbor\.|nexus\.|phanrouter|phanthy|tencent|pce-dev|m7-pce|model_eval_sdk|judge_?flow|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+'
          if grep -rInEi "$pattern" . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
               --exclude=gate.yml --exclude=package-lock.json --exclude=uv.lock \
               --exclude=upgrading.md; then
            echo "::error::internal identifier found — see the matches above"
            exit 1
          fi
      - name: No developer machine paths
        run: |
          if grep -rInE '/Users/[a-z]|/home/[a-z]+/' . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude=gate.yml; then
            echo "::error::a path from someone's machine — see the matches above"
            exit 1
          fi
      # docs/upgrading.md is excluded from these two: it is the one place that
      # has to name what an internal deployment is migrating away from.
      - name: No removed subsystems left behind
        run: |
          pattern='contest|only_forward_when_all_pass|replay_tencent|perf_throughput|run_suite'
          if grep -rInE "$pattern" . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
               --exclude=gate.yml --exclude=CHANGELOG.md --exclude=upgrading.md; then
            echo "::error::reference to a subsystem this repository does not include"
            exit 1
          fi
      - name: No credentials or captured traffic committed
        run: |
          if git ls-files | grep -v 'secrets\.example\.yaml$' \
               | grep -InE '(^|/)\.env$|\.kubeconfig$|\.pem$|(^|/)secrets\.[a-z]+\.yaml$|^dataset/'; then
            echo "::error::a credential file or a dataset is tracked"
            exit 1
          fi
